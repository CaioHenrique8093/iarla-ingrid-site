let qzState = "off", qzReconnect = null, qzPrinters = [];
function qzAvailable(){ return !!(window.qz && qz.websocket); }
let qzConfigured = false;
function qzSetup(){
  if(qzConfigured || !qzAvailable()) return;
  qz.security.setCertificatePromise(resolve=>resolve(QZ_CERT));
  if(qz.security.setSignatureAlgorithm) qz.security.setSignatureAlgorithm("SHA512");
  qz.security.setSignaturePromise(toSign => (resolve, reject) => {
    SB.functions.invoke("qz-sign", { body:{ request: toSign } })
      .then(({data, error}) => error ? reject(error) : resolve(typeof data==="string" ? data : (data && data.signature) || ""))
      .catch(reject);
  });
  qz.websocket.setClosedCallbacks(()=>{ qzState = "off"; updatePrintBar(); });
  qzConfigured = true;
}
async function qzConnect(){
  if(!qzAvailable()){ qzState = "nolib"; updatePrintBar(); return false; }
  qzSetup();
  if(qz.websocket.isActive()){ qzState = "on"; return true; }
  qzState = "connecting"; updatePrintBar();
  try{ await qz.websocket.connect({ retries:1, delay:1 }); qzState = "on"; }
  catch(e){ qzState = "off"; }
  updatePrintBar();
  return qzState === "on";
}
async function qzListPrinters(){
  if(!(await qzConnect())) return [];
  try{ qzPrinters = await qz.printers.find(); }catch(e){ qzPrinters = []; }
  if(!PRN.name){ try{ PRN.name = await qz.printers.getDefault(); }catch(e){} }
  return qzPrinters;
}
function startQzWatch(){
  clearInterval(qzReconnect);
  if(PRN.auto) qzConnect();
  qzReconnect = setInterval(()=>{ if(PRN.auto && qzState!=="on" && qzState!=="connecting") qzConnect().then(ok=>{ if(ok) autoPrint(); }); }, 20000);
}

/* imprime uma comanda; devolve true se saiu pela impressora */
async function printOrder(o, {manual=false}={}){
  const html = comandaHTML(o);
  if(PRN.name && await qzConnect()){
    try{
      const cfg = qz.configs.create(PRN.name, { units:"mm", size:{ width:80 }, margins:0, colorType:"blackwhite", interpolation:"nearest-neighbor" });
      await qz.print(cfg, [{ type:"pixel", format:"html", flavor:"plain", data: html }]);
      await markPrinted(o);
      if(manual) toast(`Comanda #${o.num} enviada para a impressora`);
      return true;
    }catch(e){
      console.error("impressão", e);
      if(manual) toast("A impressora não respondeu. Confira se ela está ligada e com papel.");
      if(!manual) return false;
    }
  }
  if(manual){ browserPrint(html); await markPrinted(o); }
  return false;
}
function browserPrint(html){
  const f = document.createElement("iframe");
  f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open(); d.write(`<!doctype html><html><head><meta charset="utf-8"><style>@page{size:80mm auto;margin:0}body{margin:0}</style></head><body>${html}</body></html>`); d.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(), 2000); }, 300);
}
/* pedidos já impressos por este computador (nunca imprime o mesmo duas vezes sozinho) */
let printedHere = new Set(LS.get("ii-printed", []));
async function markPrinted(o){
  o.printed = new Date().toISOString();
  printedHere.add(o.id); LS.set("ii-printed", [...printedHere].slice(-500));
  try{ await SB.from("pedidos").update({ impresso_em: o.printed }).eq("id", o.id); }catch(e){}
}

/* impressão automática: só neste computador, só pedidos novos ainda não impressos */
const printing = new Set(), printFailAt = {};
let autoBusy = false;
async function autoPrint(){
  if(!PRN.auto || !PRN.name || autoBusy) return;
  const limite = Date.now() - 24*3600*1000;
  const fila = DB.orders.filter(o=>o.status==="novo" && !o.printed && !printedHere.has(o.id) && !printing.has(o.id) && new Date(o.created).getTime()>limite
    && !(printFailAt[o.id] && Date.now()-printFailAt[o.id] < 60000)).reverse();
  if(!fila.length) return;
  autoBusy = true;
  try{
    if(!(await qzConnect())) return;
    for(const o of fila){
      // outra aba deste computador já está imprimindo?
      const lockKey = "ii-lock-"+o.id, lock = LS.get(lockKey, 0);
      if(Date.now()-lock < 120000) continue;
      LS.set(lockKey, Date.now()); printing.add(o.id);
      const ok = await printOrder(o);
      printing.delete(o.id);
      if(!ok){ printFailAt[o.id] = Date.now(); try{ localStorage.removeItem(lockKey); }catch(e){} toast(`Não consegui imprimir o pedido #${o.num}. Confira a impressora.`); break; }
    }
  } finally { autoBusy = false; updatePrintBar(); }
}

function printBarHTML(){
  const st = !PRN.auto ? ["", "Impressão automática desligada neste aparelho", "Ligue no computador da loja para a comanda sair sozinha."]
    : qzState==="on" ? ["on", "Impressão automática ligada", `Impressora: ${esc(PRN.name||"não escolhida")}`]
    : qzState==="connecting" ? ["", "Conectando à impressora…", "Aguarde um instante."]
    : qzState==="nolib" ? ["off", "Não foi possível carregar a impressão", "Verifique a internet e atualize a página."]
    : ["off", "Impressora desconectada", "Abra o programa QZ Tray neste computador."];
  return `<div class="printbar" id="printBar"><span class="dot ${st[0]}"></span><span class="txt"><b>${st[1]}</b><span class="muted">${st[2]}</span></span><button class="btn btn-ghost btn-sm" type="button" id="printCfg">${ic("print")}Impressora</button></div>`;
}
function bindPrintBar(){ const b = $("#printCfg"); if(b) b.onclick = openPrintSettings; }
function updatePrintBar(){ const bar = $("#printBar"); if(bar){ bar.outerHTML = printBarHTML(); bindPrintBar(); } }

async function openPrintSettings(){
  openSheet({ title:"Impressora", body:`
    <p class="muted" style="margin:0">Estas opções valem só para <b>este aparelho</b>. Ligue a impressão automática apenas no computador da loja, onde a impressora está conectada.</p>
    <label class="rc"><input type="checkbox" id="pAuto" ${PRN.auto?"checked":""}><span><b>Imprimir pedidos novos automaticamente</b><br><span class="muted small">A comanda sai sozinha assim que o cliente confirma no site.</span></span></label>
    <div class="fld"><label for="pName">Impressora</label><select class="in" id="pName"><option>Procurando impressoras…</option></select>
      <span class="hint" id="pHint">O programa QZ Tray precisa estar aberto neste computador.</span></div>`,
    foot:`<button class="btn btn-ghost" type="button" id="pTest">${ic("print")}Imprimir teste</button><button class="btn btn-primary" type="button" id="pSave">Salvar</button>`,
    onMount: async s=>{
      const list = await qzListPrinters();
      const sel = $("#pName", s);
      if(list.length){
        sel.innerHTML = list.map(n=>`<option ${n===PRN.name?"selected":""}>${esc(n)}</option>`).join("");
        $("#pHint", s).textContent = "Escolha a impressora térmica da loja.";
      } else {
        sel.innerHTML = `<option value="">Nenhuma impressora encontrada</option>`;
        $("#pHint", s).textContent = qzState==="nolib" ? "Não foi possível carregar a impressão. Verifique a internet." : "Não achei o QZ Tray. Abra o programa QZ Tray neste computador e toque em Impressora de novo.";
      }
      const save = ()=>{ PRN.auto = $("#pAuto", s).checked; if(sel.value) PRN.name = sel.value; startQzWatch(); };
      $("#pSave", s).onclick = ()=>{ save(); closeSheet(); render(); toast(PRN.auto ? "Impressão automática ligada neste aparelho" : "Impressão automática desligada"); autoPrint(); };
      $("#pTest", s).onclick = e=>busy(e.currentTarget, async()=>{
        save();
        const teste = { id:"teste", num:"0000", created:new Date().toISOString(), name:"Cliente Teste", phone:"88999999999", mode:"entrega", bairro:"COHAB 1", address:"Rua Exemplo, 123", ref:"Perto da praça",
          fee:5, date:new Date().toISOString().slice(0,10), time:"15:00", pay:"Pix", troco:"", obs:"Escrever Feliz Aniversário, Maria", status:"novo", sub:70, total:75,
          items:[{label:"Torta confeitada", detail:"Ninho com morango", qty:1, price:70}] };
        if(!PRN.name || !(await qzConnect())){ toast("Não achei o QZ Tray. Abra o programa e tente de novo."); return; }
        try{
          const cfg = qz.configs.create(PRN.name, { units:"mm", size:{ width:80 }, margins:0, colorType:"blackwhite", interpolation:"nearest-neighbor" });
          await qz.print(cfg, [{ type:"pixel", format:"html", flavor:"plain", data: comandaHTML(teste) }]);
          toast("Teste enviado para a impressora");
        }catch(err){ console.error(err); toast("A impressora não respondeu: " + (err?.message||err)); }
      });
    }});
}

/* ---------- mensagens prontas de WhatsApp ---------- */
function waText(o, tipo){
  const nome = o.name.split(" ")[0];
  const itens = o.items.map(i=>`• ${i.qty}x ${i.label}${i.detail?` (${i.detail})`:""}`).join("\n");
  const ent = o.mode==="entrega";
  const quando = `${fmtDate(o.date)}${o.time?` às ${o.time}`:""}`;
  const total = `${brl(o.total)}${ent&&o.fee==null?" + taxa de entrega":""}`;
  if(tipo==="confirmar") return `Olá, ${nome}! Aqui é da Iarla Ingrid 💛\nRecebemos seu pedido nº ${o.num}:\n${itens}\n\nTotal: ${total}\n${ent?`Entrega: ${o.address}${o.bairro?` – ${o.bairro}`:""}`:"Retirada na loja"}\nPara: ${quando}\nPagamento: ${o.pay}${o.troco?` (troco para ${o.troco})`:""}\n\nPosso confirmar?`;
  if(tipo==="confirmado") return `Pedido nº ${o.num} confirmado, ${nome}! 🎂\n${ent?"Entregamos":"Fica pronto para retirada"} ${quando}. Qualquer coisa, é só chamar aqui.`;
  if(tipo==="saiu") return `Oi, ${nome}! Seu pedido nº ${o.num} saiu para entrega 🛵 Já já chega aí!`;
  if(tipo==="pronto") return `Oi, ${nome}! Seu pedido nº ${o.num} está pronto para retirada 💛\nEndereço: ${DB.store?.address||"Rua Vicente Ferreira da Ponte, 369 · COHAB 1"}`;
  return "";
}
function waButtons(o, waNum){
  const link = t => `https://wa.me/${waNum}?text=${encodeURIComponent(waText(o,t))}`;
  const b = (t, label) => `<a class="btn btn-ghost btn-block" href="${link(t)}" target="_blank" rel="noopener">${ic("wa")}${label}</a>`;
  const nome = esc(o.name.split(" ")[0]);
  if(o.status==="novo") return b("confirmar", `Confirmar com ${nome} no WhatsApp`);
  if(o.status==="confirmado") return b("confirmado", "Avisar que está confirmado") + (o.mode==="entrega" ? b("saiu", "Avisar que saiu para entrega") : b("pronto", "Avisar que está pronto para retirada"));
  return `<a class="btn btn-ghost btn-block" href="https://wa.me/${waNum}" target="_blank" rel="noopener">${ic("wa")}Chamar ${nome} no WhatsApp</a>`;
}

/* ================= login ================= */
let currentEmail = "";
function showLogin(msg){ $("#boot").hidden = true; $("#app").hidden = true; $("#login").hidden = false; const e=$("#lgErr"); e.hidden=!msg; e.textContent=msg||""; }
async function enterApp(session){
  currentEmail = session.user.email;
  const { data, error } = await SB.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
  if(error || !data){ await SB.auth.signOut(); showLogin(error ? "Não foi possível verificar o acesso. Tente de novo." : "Este e-mail não tem acesso ao painel."); return; }
  try{ await loadAll(); }catch(e){ showLogin("Não foi possível carregar os dados. Verifique a internet e tente de novo."); return; }
  $("#boot").hidden = true; $("#login").hidden = true; $("#app").hidden = false;
  // na primeira abertura neste aparelho, não toca alerta de pedidos antigos
  if(!LS.get("ii-acked-init", false)){ DB.orders.forEach(o=>acked.add(o.id)); LS.set("ii-acked", [...acked]); LS.set("ii-acked-init", true); }
  render(); renderAlert();
  startRealtime(); startQzWatch(); autoPrint();
  // segurança: confere os pedidos a cada 15 s, mesmo se o tempo real falhar
  clearInterval(window._poll); window._poll = setInterval(refreshOrders, 15000);
}
$("#loginForm").onsubmit = async e=>{
  e.preventDefault();
  const email = $("#lg-email").value.trim(), pass = $("#lg-pass").value;
  if(!email || !pass){ showLogin("Informe e-mail e senha."); return; }
  try{ localStorage.setItem("ii-keep", $("#lg-keep").checked ? "1" : "0"); }catch(_){}
  makeClient();
  const btn = $("#lgBtn"); btn.disabled = true; btn.textContent = "Entrando…";
  const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = "Entrar";
  if(error){ showLogin(/invalid/i.test(error.message) ? "E-mail ou senha incorretos." : "Não foi possível entrar. Verifique a internet e tente de novo."); return; }
  await enterApp(data.session);
};
$("#forgot").onclick = async ()=>{
  const email = $("#lg-email").value.trim();
  if(!email){ showLogin("Digite seu e-mail acima e toque de novo em “Esqueci minha senha”."); $("#lg-email").focus(); return; }
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  showLogin(error ? "Não foi possível enviar o e-mail agora. Tente de novo em alguns minutos." : "");
  if(!error) toast("Se esse e-mail tiver acesso, enviamos um link para criar uma nova senha.");
};
function newPasswordSheet(){
  openSheet({title:"Nova senha", body:`
    <div class="fld"><label for="np1">Nova senha</label><input class="in" id="np1" type="password" autocomplete="new-password" minlength="8"><span class="hint">Mínimo de 8 caracteres.</span></div>
    <div class="fld"><label for="np2">Repita a nova senha</label><input class="in" id="np2" type="password" autocomplete="new-password"></div>`,
    foot:`<button class="btn btn-ghost" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="button" id="npSave">Salvar senha</button>`,
    onMount:s=>{ $("#npSave",s).onclick=e=>busy(e.currentTarget, async()=>{ const a=$("#np1",s).value, b=$("#np2",s).value;
      if(a.length<8){ toast("A senha precisa ter pelo menos 8 caracteres."); return; } if(a!==b){ toast("As senhas não são iguais."); return; }
      const { error } = await SB.auth.updateUser({ password:a }); if(error){ toast("Não foi possível trocar a senha. Tente de novo."); return; }
      closeSheet(); toast("Senha alterada");
      const { data } = await SB.auth.getSession(); if(data.session && $("#app").hidden) enterApp(data.session); }); }});
}
async function logout(){ clearInterval(window._poll); stopRealtime(); stopAlarm(); clearInterval(qzReconnect); $("#alertRoot").innerHTML=""; await SB.auth.signOut(); $("#lg-pass").value=""; showLogin(""); }

(async function boot(){
  if(!window.supabase || !CFG.url || !CFG.key || /COLE/i.test(CFG.key)){ $("#boot").textContent = "Configuração pendente: cole a chave pública do Supabase no arquivo config.js."; return; }
  $("#lg-keep").checked = keepPref();
  makeClient();
  const { data } = await SB.auth.getSession();
  if(data.session && !/type=recovery/.test(location.hash)) enterApp(data.session); else showLogin("");
})();
</script>
